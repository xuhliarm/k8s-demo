apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-nginx-config
  namespace: monitoring
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location / {
        auth_basic "Prometheus Login";
        auth_basic_user_file /etc/nginx/auth/auth;

        proxy_pass http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
      }

      location = /healthz {
        access_log off;
        return 200 "OK";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-proxy
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-proxy
  template:
    metadata:
      labels:
        app: prometheus-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-nginx-config
        - name: auth
          secret:
            secretName: prometheus-nginx-auth
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-proxy
  namespace: monitoring
spec:
  selector:
    app: prometheus-proxy
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    alb.ingress.kubernetes.io/group.name: k8s-demo
    alb.ingress.kubernetes.io/group.order: "40"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-north-1:069129260880:certificate/59f31678-7ba1-4e28-805a-f054cc79f3f5
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - host: prometheus-k8s-demo.itlama.sk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-proxy
                port:
                  number: 8080
