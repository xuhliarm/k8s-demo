apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: frontend-http
  namespace: monitoring
  labels:
    release: monitoring
spec:
  jobName: frontend-http
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://frontend.frontend.svc.cluster.local:8081/
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: backend-http
  namespace: monitoring
  labels:
    release: monitoring
spec:
  jobName: backend-http
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://backend.backend.svc.cluster.local:8080/actuator/health
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-availability
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: application-availability
      rules:
        - alert: FrontendDown
          expr: probe_success{job="frontend-http"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Frontend is unavailable"
        - alert: BackendDown
          expr: probe_success{job="backend-http"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Backend is unavailable"
