apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: {{ .Values.namespaces.frontend }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: {{ .Values.namespaces.backend }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-read-config
  namespace: {{ .Values.namespaces.backend }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["backend-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-read-config
  namespace: {{ .Values.namespaces.backend }}
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: {{ .Values.namespaces.backend }}
roleRef:
  kind: Role
  name: app-read-config
  apiGroup: rbac.authorization.k8s.io
